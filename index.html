<!DOCTYPE html>
<html lang="en" oncontextmenu="return false">
  <head>
    <link
      rel="shortcut icon"
      href="./images/church_1.png"
      type="image/x-icon"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>U.P.C. Directory</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link
      href="https://cdn.boxicons.com/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
    <script
      src="https://maps.googleapis.com/maps/api/js?key=My_Api_Key"
      defer
    ></script>
    <script src="./js/script.js" defer></script>
  </head>
  <body>
    <main>
      <section class="hero-section">
        <div id="hero-image">
          <h1 class="cta1">find a local UPC church</h1>
          <h2 class="cta2">Connect with your community</h2>
          <h3 class="cta3">
            <a href="#map-section">
              <i class="bx bx-arrow-down-stroke-circle"></i>
            </a>
          </h3>
        </div>
      </section>

      <section class="map-section" id="map-section">
        <div id="map"></div>
      </section>

      <section class="results-section">
        <!-- Search input -->
        <div class="search-filter">
          <input
            id="searchBox"
            type="text"
            placeholder="Search by church name..."
            onkeyup="applyFilter()"
          />
        </div>

        <div class="table-section">
          <table id="placesTable">
            <thead>
              <tr>
                <th id="churchName">Church Name</th>
                <th id="churchAddress">Address</th>
                <th id="churchPastor">Pastor</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>

          <div class="pagination">
            <button onclick="prevPage()">Prev</button>
            <span id="pageInfo"></span>
            <button onclick="nextPage()">Next</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer-section">
      <span
        >Copyright © 2025 Find A Local Church U.P.C. S.A. | All Rights
        Reserved.</span
      >
      <hr />
      <span>
        All rights reserved &copy; <span id="currentYear"></span>
        <a id="brand" href="https://milano-faarland.web.app/" target="_blank"
          >Scyphers Den</a
        >
      </span>
    </footer>
  </body>
</html>
